id: sonar-comma-or-logical-or-case
language: typescript
severity: error
message: "case with `||` or the comma operator only matches one operand; use stacked case labels (replaces sonarjs/comma-or-logical-or-case)"
rule:
  kind: switch_case
  has:
    field: value
    stopBy: end
    any:
      - kind: sequence_expression
      - pattern: $A || $B
