id: directive-no-enable
language: typescript
severity: error
message: Enable directives are forbidden; use next-line/same-line disables, or a whole-file disable before all code.
rule:
  kind: comment
  regex: '^(//|/\*+)\s*(eslint|oxlint)-enable(\s|\*/|$)'
