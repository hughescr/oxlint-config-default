id: sonar-no-useless-increment
language: typescript
severity: error
message: Post-increment/decrement assigned back to the same variable is a no-op (replaces sonarjs/no-useless-increment)
rule:
  any:
    - pattern: $X = $X++
    - pattern: $X = $X--
