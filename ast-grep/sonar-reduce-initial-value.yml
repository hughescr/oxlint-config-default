id: sonar-reduce-initial-value
language: typescript
severity: error
message: reduce()/reduceRight() without an initial value throws TypeError on an empty array (replaces sonarjs/reduce-initial-value)
rule:
  any:
    - pattern: $A.reduce($F)
    - pattern: $A.reduceRight($F)
