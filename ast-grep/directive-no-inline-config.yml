id: directive-no-inline-config
language: typescript
severity: error
message: Inline eslint/global/globals/exported/eslint-env configuration is forbidden; put configuration in the project config.
rule:
  kind: comment
  regex: '^(//|/\*+)\s*(eslint|globals?|exported|eslint-env)(\s|\*/|$)'
